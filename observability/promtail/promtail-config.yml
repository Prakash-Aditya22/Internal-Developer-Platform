server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # IDP Application logs
  - job_name: idp-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: idp
          __path__: /var/log/idp/*.log

  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            container_id: attrs.container_id
      - labels:
          stream:
          container_id:
      - output:
          source: output
      - timestamp:
          source: time
          format: RFC3339Nano

  # System logs (optional)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
